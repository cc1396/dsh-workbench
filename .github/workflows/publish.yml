# Publish on a version tag: push vX.Y.Z and the bundle is built and sent to npm.
# Requires one repository secret: NPM_TOKEN (an npm automation token).
# The package name is fixed here once you have chosen it.
name: publish

on:
  push:
    tags: ['v*']

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Build the publishable copy
        run: node publish/prepare.mjs --name cc1396-dsh-workbench --version "${GITHUB_REF_NAME#v}" --out publish/dist
      - name: Publish to npm
        run: npm publish publish/dist --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
