- insert:
    - id: dsh-workbench
      name: '@local/dsh-workbench'
      config:
        # 每次快照最多读取的 Session 数，以及读取的时间预算（毫秒）。
        # 超出预算的 Session 留到下一定时刷新，面板始终可交互。
        maxScanSessions: 120
        scanBudgetMs: 2500
        # 概览「最近结束」显示的行数。
        maxRecentTasks: 8
        # 金额一律按人民币估算：元 / 每百万 Token。
        # 未单独列出的模型使用 default 这一行，请按实际账单调整；
        # 改价后建议同步修改 ref，它会显示在请求明细里。
        prices:
          ref: configured
          default:
            input: 2
            output: 8
            cacheRead: 0.5
            cacheWrite: 2
          models:
            deepseek-chat:
              input: 2
              output: 8
              cacheRead: 0.5
            deepseek-reasoner:
              input: 4
              output: 16
              cacheRead: 1
            deepseek-flash:
              input: 0.5
              output: 2
              cacheRead: 0.1
            codearts/deepseek-v4.1-flash-1017:
              input: 0.5
              output: 2
              cacheRead: 0.1
            workbuddy-ai/deepseek-v4.1-flash:
              input: 0.5
              output: 2
              cacheRead: 0.1
