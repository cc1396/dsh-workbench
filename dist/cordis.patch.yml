- insert:
    - id: dsh-workbench
      name: 'cc1396-dsh-workbench'
      config:
        # 每个任务列表渲染的行数。
        maxRunningTasks: 8
        maxRecentTasks: 8
        # Session 日志扫描上限：折算结果按 Session 缓存，超出预算的部分
        # 由下一次轮询接着处理。
        maxScanSessions: 60
        scanBudgetMs: 4000
        # 钱包查询频率上限（毫秒）。
        balanceTtlMs: 60000
        # 本地估算用的币种与价目版本。金额是估算，不是平台账单。
        currency: USD
        prices:
          ref: configured
          default:
            input: 2
            output: 8
            cacheRead: 0.5
          models:
            deepseek-chat:
              input: 2
              output: 8
              cacheRead: 0.5
            deepseek-reasoner:
              input: 4
              output: 16
              cacheRead: 1
        # P1 推断类关注项：可能卡住 / 工具连续失败默认开；
        # 费用阈值与费用突增默认关，待基线数据验证后开启。
        rules:
          stuck: true
          toolFailures: true
          costThreshold: false
          costSpike: false
