- insert:
    - id: dsh-workbench
      name: 'cc1396-dsh-workbench'
      config:
        # 每个任务列表渲染的行数。
        maxRunningTasks: 8
        maxRecentTasks: 8
        # Session 日志扫描上限：折算结果按 Session 缓存，超出预算的部分
        # 由下一次轮询接着处理。
        maxScanSessions: 60
        scanBudgetMs: 4000
        # 钱包查询频率上限（毫秒）。
        balanceTtlMs: 60000
        # 本地金额估算用的单价：元 / 每 100 万 Token。
        # 默认值只是示例，请按你实际使用的模型定价修改。
        prices:
          default:
            input: 2
            output: 8
            cacheRead: 0.5
          models:
            deepseek-chat:
              input: 2
              output: 8
              cacheRead: 0.5
            deepseek-reasoner:
              input: 4
              output: 16
              cacheRead: 1
